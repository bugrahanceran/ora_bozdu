version: collection.v1

region:
  slug: eryaman
  name: Eryaman
  center:
    latitude: 39.979
    longitude: 32.636

discovery:
  target_count: 30
  minimum_candidate_pool: 30
  radius_meters: 2000
  page_size: 20
  min_user_ratings_total: 100
  max_branches_per_brand: 2
  queries:
    - category: cafe
      text_query: cafe
      included_type: cafe
    - category: restaurant
      text_query: restaurant
      included_type: restaurant
  category_minimums:
    cafe: 6
    restaurant: 10
  brand_stopwords:
    - ankara
    - eryaman
    - etimesgut
    - göksu
    - metromall
  brand_aliases: {}
  stale_after_days: 183
  stale_penalty: 1.5
  review_count_log_weight: 1.0
  search_cache_path: data/discovery-search-cache.json
  report_path: reports/discovery-latest.json

fetch:
  cadence: weekly
  week_start: monday
  review_sorts:
    - newest
    - most_relevant
  reviews_no_translations: true
  fields:
    - name
    - business_status
    - rating
    - user_ratings_total
    - price_level
    - reviews
